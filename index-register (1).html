<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0879d5">
<title>مركز الربيع | تسجيل الدخول</title>
<style>
:root{--blue:#087ed8;--deep:#0755b4;--glass:rgba(145,220,255,.28);--line:rgba(255,255,255,.72)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:#fff}
body{min-height:100svh;background:radial-gradient(ellipse at 50% 18%,#a7edff 0,#49b9f4 20%,transparent 43%),radial-gradient(ellipse at 10% 70%,#0878d3 0,#0649a6 48%,transparent 72%),linear-gradient(145deg,#14c8ff 0%,#087bd4 38%,#0050ad 72%,#087fe0 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:-15%;pointer-events:none;z-index:-1}
body:before{background:repeating-linear-gradient(155deg,transparent 0 110px,rgba(255,255,255,.14) 112px,transparent 118px 190px);transform:rotate(-4deg)}
body:after{background:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.32),transparent 28%),radial-gradient(ellipse at 90% 55%,rgba(66,219,255,.26),transparent 35%);filter:blur(12px)}
.glow{position:fixed;height:2px;width:120vw;background:#8cf5ff;box-shadow:0 0 14px 4px #28dcff;transform:rotate(-27deg);left:-10vw;top:6%;opacity:.8;pointer-events:none}
.page{width:min(100%,590px);margin:auto;padding:20px 16px 18px;position:relative}
.brand{text-align:center;margin:0 auto 10px}
.logo{width:105px;height:105px;border:4px solid rgba(255,255,255,.9);border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(47,207,255,.25),0 0 25px #8eeeff;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(202,244,255,.65));color:#0878c7}
.logo svg{width:78px;height:78px}
.brand h1{font-size:clamp(27px,6vw,36px);margin:0;font-weight:900;text-shadow:0 2px 4px #0753a6}
.brand p{margin:3px 0;font-weight:bold;font-size:15px;color:#e6faff;text-shadow:0 1px 3px #0755a0}
.welcome{font-size:15px;line-height:1.7;margin-top:16px}
.panel{background:linear-gradient(145deg,rgba(145,224,255,.53),rgba(16,121,216,.46));border:1.5px solid rgba(255,255,255,.8);border-radius:34px;padding:17px 21px 16px;box-shadow:inset 0 1px 8px rgba(255,255,255,.65),0 12px 35px rgba(0,42,120,.28);backdrop-filter:blur(12px)}
.panel-head{display:flex;align-items:center;justify-content:flex-start;gap:12px;margin-bottom:14px}
.person-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);flex-shrink:0}
.panel-head h2{font-size:24px;margin:0 0 4px}.panel-head small{font-size:11px;color:#e9faff}
.field{height:55px;border-radius:35px;background:linear-gradient(105deg,rgba(230,249,255,.72),rgba(102,192,248,.55));border:1px solid rgba(255,255,255,.78);box-shadow:inset 0 2px 6px rgba(255,255,255,.35),0 3px 9px rgba(0,58,130,.12);display:flex;align-items:center;gap:12px;padding:5px 10px;margin:8px 0;color:#fff}
.field .ico{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:rgba(0,125,213,.36);border:1px solid rgba(255,255,255,.55);flex-shrink:0}
.field .content{min-width:0;flex:1}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:3px}
.field input,.field select{display:block;width:100%;border:0;outline:0;background:transparent;color:#fff;font:13px Tahoma,Arial;text-align:right;padding:0}
.field input::placeholder{color:rgba(255,255,255,.85)}
.field select option{color:#0755a8}
.split{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.split .field{margin:8px 0}
.submit{margin-top:13px;width:100%;height:54px;border-radius:32px;border:1px solid rgba(255,255,255,.9);background:linear-gradient(90deg,#04a4f3,#0873ec,#11a9f1);color:white;font-size:24px;font-weight:900;box-shadow:inset 0 1px 6px #a9f3ff,0 0 18px rgba(0,225,255,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}
.submit span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#29bff4;border:1px solid #b9f8ff}
.footer{text-align:center;font-weight:bold;font-size:13px;margin:17px auto 0;color:#eafaff;display:flex;gap:12px;align-items:center;justify-content:center}.footer:before,.footer:after{content:"";height:1px;background:rgba(255,255,255,.75);width:48px}
@media(min-height:900px){.page{padding-top:25px}.brand{margin-bottom:14px}.panel{padding:20px 22px}.field{height:57px;margin:9px 0}}
@media(max-width:370px){.page{padding:12px 10px}.panel{padding:14px 13px;border-radius:27px}.field{height:51px}.brand p{font-size:13px}.panel-head h2{font-size:21px}}
</style>
</head>
<body><div class="glow"></div>
<main class="page">
<header class="brand">
<h1>مركز الربيع</h1><p>للعلاج الطبيعي وتأهيل الأطفال</p>
<div class="welcome">مرحباً بك في مركز الربيع<br>نحن هنا لنجعل كل خطوة نحو التعافي أسهل</div>
</header>
<section class="panel">
<div class="panel-head"><div class="person-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg></div><div><h2>تسجيل الدخول</h2><small>الرجاء إدخال البيانات التالية</small></div></div>
<form id="loginForm">
<div class="field"><div class="content"><label for="parent">الاسم</label><input id="parent" required placeholder="أدخل اسمك بالكامل" autocomplete="name"></div><div class="ico">♙</div></div>
<div class="field"><div class="content"><label for="phone">رقم الهاتف</label><input id="phone" required type="tel" inputmode="tel" placeholder="أدخل رقم هاتفك" autocomplete="tel"></div><div class="ico">☎</div></div>
<div class="field"><div class="content"><label for="child">اسم الطفل</label><input id="child" required placeholder="أدخل اسم الطفل"></div><div class="ico">♙</div></div>
<div class="split">
<div class="field"><div class="content"><label for="birth">تاريخ الميلاد</label><input id="birth" type="date" required aria-label="تاريخ الميلاد"></div><div class="ico">▦</div></div>
<div class="field"><div class="content"><label for="age">عمر الطفل</label><input id="age" type="number" min="0" max="99" required placeholder="أدخل عمر الطفل"></div><div class="ico">▦</div></div>
</div>
<div class="field"><div class="content"><label for="gender">الجنسية</label><select id="gender" required><option value="">اختر الجنسية</option><option>مصري</option><option>أخرى</option></select></div><div class="ico">◎</div></div>
<div class="field"><div class="content"><label for="days">عدد أيام الحضور في المركز</label><select id="days" required><option value="">أدخل عدد الأيام</option><option>يوم واحد</option><option>يومان</option><option>3 أيام</option><option>4 أيام</option><option>يوميًا</option></select></div><div class="ico">▦</div></div>
<div class="field"><div class="content"><label for="hours">عدد ساعات العلاجية</label><select id="hours" required><option value="">أدخل عدد الساعات</option><option>ساعة واحدة</option><option>ساعتان</option><option>3 ساعات</option><option>4 ساعات</option></select></div><div class="ico">◷</div></div>
<div class="field"><div class="content"><label for="type">نوع الساعات العلاجية</label><select id="type" required><option value="">اختر نوع الساعات العلاجية</option><option>جلسة علاج طبيعي</option><option>تأهيل حركي</option><option>تخاطب</option><option>علاج وظيفي</option></select></div><div class="ico">☷</div></div>
<button class="submit" type="submit">دخول <span>➜</span></button>
<p id="msg" role="status" style="display:none;text-align:center;font-size:13px;margin-bottom:0"></p>
</form></section>
<footer class="footer">مركز الربيع للعلاج الطبيعي وتأهيل الأطفال</footer>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    
    const parentVal = document.getElementById('parent').value;
    const childVal = document.getElementById('child').value;
    const phoneVal = document.getElementById('phone').value;
    const birthVal = document.getElementById('birth').value;
    const ageVal = document.getElementById('age').value;
    const genderVal = document.getElementById('gender').value;
    const daysVal = document.getElementById('days').value;
    const hoursVal = document.getElementById('hours').value;
    const typeVal = document.getElementById('type').value;

    const data = {
        full_name: childVal,
        parent_name: parentVal,
        phone: phoneVal,
        date_of_birth: birthVal,
        age: ageVal,
        nationality: genderVal,
        days: daysVal,
        hours: hoursVal,
        service_type: typeVal,
        medical_history: `الجلسة: ${typeVal} | الساعات: ${hoursVal} | الأيام: ${daysVal}`
    };

    try {
        const response = await fetch('http://localhost:5000/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if(result.success) {
            // حفظ بيانات المريض وولي الأمر محلياً
            sessionStorage.setItem('alrabeaPatient', JSON.stringify(data));
            const msg = document.getElementById('msg');
            msg.style.display = 'block';
            msg.style.color = '#27ae60';
            msg.textContent = '✅ تم تسجيل الطفل بنجاح! جاري الانتقال...';
            setTimeout(() => { window.location.href = 'index-home_2.html'; }, 1200);
        }
    } catch (err) {
        alert('تأكد من تشغيل السيرفر أولاً عبر أمر node server.js');
    }
});
</script>
</body></html>
