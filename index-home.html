<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0879d5">
<title>مركز الربيع | الرئيسية</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:#fff}
body{min-height:100svh;background:radial-gradient(ellipse at 60% 22%,#55c6ff 0,transparent 38%),radial-gradient(ellipse at 0 85%,#0062c5 0,transparent 48%),linear-gradient(145deg,#08baff,#087ad8 43%,#0054b4 75%,#0a8ce6);overflow-x:hidden}
body:before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:repeating-linear-gradient(155deg,transparent 0 100px,rgba(255,255,255,.12) 102px,transparent 108px 180px);transform:rotate(-5deg)}
body:after{content:"";position:fixed;top:0;left:-20%;width:140%;height:2px;background:#6ff5ff;box-shadow:0 0 15px 5px #2bdfff;transform:rotate(-27deg);pointer-events:none}
.page{width:min(100%,680px);margin:auto;padding:25px 20px 24px}
.profile{display:flex;align-items:center;gap:18px;margin:0 8px 28px}.avatar{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(140deg,rgba(255,255,255,.65),rgba(255,255,255,.13));border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 2px 8px rgba(255,255,255,.5)}.avatar svg{width:55px;height:55px;fill:#e9f9ff}
.greeting{font-size:24px;color:#c9f2ff;margin-bottom:3px}.name{font-size:32px;font-weight:900;line-height:1.3}
.glass{background:linear-gradient(135deg,rgba(135,219,255,.4),rgba(13,116,215,.4));border:1px solid rgba(255,255,255,.66);border-radius:31px;box-shadow:inset 0 1px 9px rgba(255,255,255,.32),0 12px 25px rgba(0,40,110,.16);backdrop-filter:blur(10px)}
.next{padding:18px 16px 22px;margin-bottom:18px}.heading{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900;margin:0 0 17px}.heading .mini{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);font-size:25px}
.details{background:linear-gradient(105deg,rgba(235,250,255,.75),rgba(143,215,255,.72));border-radius:19px;color:#0755a7;padding:16px 8px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;text-align:center;gap:4px}
.detail{padding:2px 4px;min-width:0;border-left:1px solid rgba(0,89,173,.24)}.detail:last-child{border-left:0}.detail .label{font-size:14px;margin-bottom:5px}.detail strong{font-size:18px;display:block;line-height:1.45}.detail .symbol{font-size:24px;display:block;margin-bottom:3px}
.subdetails{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.subdetail{border-radius:20px;padding:15px 10px;text-align:center;background:linear-gradient(120deg,rgba(235,250,255,.75),rgba(143,215,255,.66));color:#0755a7;display:flex;align-items:center;justify-content:center;gap:12px;min-height:90px}.subdetail .symbol{font-size:26px}.subdetail .label{font-size:15px;margin-bottom:5px}.subdetail strong{font-size:19px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.action{height:91px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 8px rgba(255,255,255,.35),0 7px 16px rgba(0,39,120,.16);font-size:20px;font-weight:900;cursor:pointer;color:white}.confirm{background:linear-gradient(130deg,#16cfc8,#00a9a6)}.decline{background:linear-gradient(130deg,#c773e9,#7659d7)}.circle{width:53px;height:53px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.52);font-size:30px;flex-shrink:0}
.linkrow{width:100%;padding:16px 20px;min-height:108px;margin:0 0 14px;display:flex;align-items:center;gap:18px;text-align:right;color:#fff;cursor:pointer}.linkrow .circle{width:70px;height:70px;font-size:30px}.linkcopy{flex:1}.linkcopy strong{display:block;font-size:25px;margin-bottom:7px}.linkcopy small{font-size:14px;color:#c8efff}.chev{font-size:32px;margin-left:3px}
.nav{position:sticky;bottom:10px;margin:27px -3px 0;border-radius:50px;min-height:88px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:9px 5px;background:linear-gradient(120deg,rgba(159,224,255,.4),rgba(4,102,200,.46));border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 8px rgba(255,255,255,.35),0 8px 20px rgba(0,30,90,.2);backdrop-filter:blur(12px)}
.nav button{border:0;background:transparent;color:#bdeeff;font:13px Tahoma,Arial;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}.nav .ni{font-size:29px;line-height:1}.nav button.active{color:#fff;font-weight:bold}.nav button.active:after{content:"";width:46px;height:3px;border-radius:3px;background:#fff;margin-top:0}
.notice{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);width:min(90%,440px);padding:14px 18px;background:#0756a9;border:1px solid rgba(255,255,255,.7);border-radius:15px;text-align:center;box-shadow:0 8px 25px #003d87;display:none;z-index:10}
@media(max-width:430px){.page{padding:22px 15px 20px}.profile{margin-bottom:24px}.avatar{width:70px;height:70px}.greeting{font-size:22px}.name{font-size:29px}.next{padding:15px 12px 17px}.heading{font-size:20px}.details{padding:13px 4px}.detail .label{font-size:12px}.detail strong{font-size:16px}.detail .symbol{font-size:22px}.subdetail{gap:7px;padding:12px 5px;min-height:83px}.subdetail .label{font-size:13px}.subdetail strong{font-size:17px}.actions{gap:9px}.action{font-size:16px;height:82px;gap:6px;border-radius:22px}.circle{width:43px;height:43px;font-size:25px}.linkrow{min-height:100px;padding:13px 15px;gap:13px}.linkrow .circle{width:60px;height:60px}.linkcopy strong{font-size:21px}.linkcopy small{font-size:12px}.nav{min-height:82px}.nav button{font-size:11px}.nav .ni{font-size:26px}}
@media(max-width:350px){.actions{grid-template-columns:1fr}.action{height:65px}.details{grid-template-columns:1fr}.detail{border-left:0;border-bottom:1px solid rgba(0,89,173,.2);padding:8px}.detail:last-child{border-bottom:0}.detail .symbol{display:inline;margin-left:8px}}
</style>
</head>
<body><main class="page">
<header class="profile"><div class="avatar"><svg viewBox="0 0 64 64"><circle cx="32" cy="19" r="12"/><path d="M9 59c0-15 10-24 23-24s23 9 23 24z"/></svg></div><div><div class="greeting">مرحباً</div><div class="name" id="patientName">محمد زيد</div></div></header>
<section class="glass next">
<h2 class="heading"><span class="mini">▦</span>ميعاد الجلسة القادمة</h2>
<div class="details">
<div class="detail"><span class="symbol">▦</span><div class="label">السبت</div><strong>4 أكتوبر 2026</strong></div>
<div class="detail"><span class="symbol">♙</span><div class="label">مع دكتور</div><strong>فوزان</strong></div>
<div class="detail"><span class="symbol">◷</span><div class="label">الساعة</div><strong>5:00 مساءً</strong></div>
</div>
<div class="subdetails">
<div class="subdetail"><span class="symbol">♧</span><div><div class="label">نوع الجلسة</div><strong>جلسة علاجية</strong></div></div>
<div class="subdetail"><span class="symbol">◷</span><div><div class="label">مدة الجلسة</div><strong>3 ساعات</strong></div></div>
</div>
</section>
<div class="actions">
<button class="action confirm" onclick="notify('تم تسجيل تأكيد الحضور محليًا.')"><span class="circle">✓</span>تأكيد الحضور <span>›</span></button>
<button class="action decline" onclick="notify('تم تسجيل الاعتذار محليًا. تواصل مع المركز لتحديث الجدول.')"><span class="circle">×</span>الاعتذار عن الجلسة <span>‹</span></button>
</div>
<button class="glass linkrow" onclick="notify('قسم طلباتي: ستظهر هنا الطلبات المرتبطة بحسابك بعد ربط قاعدة البيانات.')"><span class="circle">▤</span><span class="linkcopy"><strong>طلباتي</strong><small>عرض جميع طلباتك ومتابعتها</small></span><span class="chev">‹</span></button>
<button class="glass linkrow" onclick="notify('السياسات والقوانين: يُرجى الالتزام بتعليمات المركز ومواعيد الجلسات.')"><span class="circle">♧</span><span class="linkcopy"><strong>السياسات والقوانين</strong><small>تعرف على الشروط والأحكام</small></span><span class="chev">‹</span></button>
<nav class="nav">
<button onclick="notify('الإعدادات غير مربوطة بعد.')"><span class="ni">⚙</span>الإعدادات</button>
<button onclick="notify('التقارير ستظهر بعد توصيل قاعدة البيانات.')"><span class="ni">▤</span>التقارير</button>
<button onclick="notify('قسم جلساتي.')"><span class="ni">▦</span>جلساتي</button>
<button class="active" onclick="notify('أنت الآن في الصفحة الرئيسية.')"><span class="ni">⌂</span>الرئيسية</button>
</nav>
<div id="notice" class="notice" role="status"></div>
</main>
<script>
function notify(message){
    const n=document.getElementById('notice');
    n.textContent=message;
    n.style.display='block';
    clearTimeout(window.noticeTimer);
    window.noticeTimer=setTimeout(()=>n.style.display='none',3000);
}

window.addEventListener('DOMContentLoaded', async () => {
    try {
        // قراءة بيانات ولي الأمر والطفل المسجل
        const stored = JSON.parse(sessionStorage.getItem('alrabeaPatient') || 'null');
        
        if (stored && stored.parent_name) {
            document.getElementById('patientName').textContent = stored.parent_name;
        }

        // جلب أحدث تقرير طبي أو بيانات جلسة
        const response = await fetch('http://localhost:5000/api/children');
        const data = await response.json();
        if (data && data.length > 0) {
            const lastChild = data[data.length - 1];
            console.log("الطفل المسجل بالمنظومة:", lastChild);
        }
    } catch (e) {
        console.log("السيرفر غير متصل حالياً");
    }
});

// ربط زر الفواتير/طلباتي للتحويل الفعلي
document.querySelectorAll('.linkrow')[0].addEventListener('click', () => {
    window.location.href = 'invoices.htm';
});

async function showReports() {
    try {
        const response = await fetch('http://localhost:5000/api/children');
        const data = await response.json();
        if(data && data.length > 0) {
            const current = data[data.length - 1];
            notify(`📋 تقرير الطفل (${current.full_name}): ${current.medical_history}`);
        } else {
            notify("لا توجد تقارير طبية مسجلة حالياً.");
        }
    } catch(err) {
        notify("تعذر الاتصال بالسيرفر.");
    }
}

document.querySelector('button[onclick*="التقارير"]').setAttribute('onclick', "showReports()");
</script></body></html>
